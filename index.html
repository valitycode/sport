<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ski Foux d'Allos - Prototype+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #202733;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    /* HUD global */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: white;
      font-size: 12px;
    }

    #topHUD {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
      white-space: nowrap;
    }

    #topHUD span {
      opacity: 0.9;
    }

    #liftInfo {
      font-weight: 600;
    }

    /* Joystick */
    #joystickContainer {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .joystick-base {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.6));
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .joystick-stick {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #cfd3e0);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      transform: translate(0, 0);
      transition: transform 0.08s ease-out;
      touch-action: none;
    }

    /* Boutons remontées */
    #liftButtons {
      position: absolute;
      right: 10px;
      bottom: 22%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .lift-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .lift-btn span.dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .lift-btn.active {
      background: rgba(59,130,246,0.9);
    }

    /* Météo + Shop boutons */
    #sideButtons {
      position: absolute;
      left: 10px;
      bottom: 22%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .ui-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #hint {
      position: absolute;
      bottom: 210px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.35);
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    /* Minimap */
    #minimap {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      pointer-events: none;
    }

    /* Panneau Shop */
    #shopOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #shopPanel {
      pointer-events: auto;
      min-width: 240px;
      max-width: 320px;
      background: rgba(15,23,42,0.95);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      gap: 10px;
      color: #e5e7eb;
      font-size: 13px;
    }

    #shopTitle {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .shop-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .shop-item {
      flex: 1 1 30%;
      min-width: 70px;
      border-radius: 12px;
      padding: 6px 4px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      text-align: center;
      cursor: pointer;
    }

    .shop-color-preview {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      margin: 0 auto 4px auto;
      border: 1px solid rgba(15,23,42,0.7);
    }

    #shopClose {
      align-self: flex-end;
      font-size: 11px;
      opacity: 0.8;
      cursor: pointer;
    }

    /* Chute info */
    #fallInfo {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="topHUD">
      <span>🏔️ Station : <strong>Foux d’Allos (style)</strong></span>
      <span>🎿 Vitesse : <span id="speedInfo">0.0</span> m/s</span>
      <span>🚶 File : <span id="queueInfo">bas des pistes</span></span>
      <span>🚡 Remontée : <span id="liftInfo">aucune</span></span>
      <span>⛅ Météo : <span id="weatherInfo">soleil</span></span>
    </div>

    <canvas id="minimap" width="120" height="120"></canvas>

    <div id="hint">Pose ton pouce sur le joystick pour tourner et accélérer</div>

    <div id="joystickContainer">
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
    </div>

    <div id="liftButtons">
      <button class="lift-btn" id="btnAiguille">
        <span class="dot"></span>3 places – Aiguille
      </button>
      <button class="lift-btn" id="btnChaux">
        <span class="dot"></span>6 places – Chaux
      </button>
    </div>

    <div id="sideButtons">
      <button class="ui-btn" id="btnWeather">⛅ Météo</button>
      <button class="ui-btn" id="btnShop">🛍️ Shop</button>
    </div>

    <div id="shopOverlay">
      <div id="shopPanel">
        <div id="shopClose">✕ Fermer</div>
        <div id="shopTitle">Shop – Tenues</div>
        <div class="shop-items">
          <div class="shop-item" data-style="blue">
            <div class="shop-color-preview" style="background: linear-gradient(135deg,#1d4ed8,#60a5fa);"></div>
            <div>Bleu</div>
          </div>
          <div class="shop-item" data-style="red">
            <div class="shop-color-preview" style="background: linear-gradient(135deg,#b91c1c,#f97316);"></div>
            <div>Rouge</div>
          </div>
          <div class="shop-item" data-style="green">
            <div class="shop-color-preview" style="background: linear-gradient(135deg,#047857,#22c55e);"></div>
            <div>Vert</div>
          </div>
        </div>
        <small style="opacity:0.75;">Les tenues sont purement cosmétiques dans ce prototype.</small>
      </div>
    </div>

    <div id="fallInfo">💥 Oups, chute ! Respawn...</div>
  </div>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    // ==========================
    //       VARIABLES GLOBALES
    // ==========================
    let scene, camera, renderer, clock;
    let skier, skierGroup;
    let bots = [];
    const BOT_COUNT = 18;
    let worldPlane;
    let hemiLight, dirLight;

    let joystickBase = document.getElementById('joystickBase');
    let joystickStick = document.getElementById('joystickStick');
    let speedInfo = document.getElementById('speedInfo');
    let queueInfo = document.getElementById('queueInfo');
    let liftInfo = document.getElementById('liftInfo');
    let weatherInfo = document.getElementById('weatherInfo');
    let btnAiguille = document.getElementById('btnAiguille');
    let btnChaux = document.getElementById('btnChaux');
    let btnWeather = document.getElementById('btnWeather');
    let btnShop = document.getElementById('btnShop');
    let shopOverlay = document.getElementById('shopOverlay');
    let shopPanel = document.getElementById('shopPanel');
    let shopClose = document.getElementById('shopClose');
    let fallInfo = document.getElementById('fallInfo');

    const minimapCanvas = document.getElementById('minimap');
    const mmCtx = minimapCanvas.getContext('2d');

    // Obstacles pour collisions
    let obstacles = [];

    // Joystick state
    let joystick = {
      active: false,
      baseX: 0,
      baseY: 0,
      valueX: 0,
      valueY: 0
    };

    // Player physics & state
    const playerState = {
      velocity: new THREE.Vector3(0, 0, 0),
      maxSpeed: 35,
      acceleration: 45,
      friction: 12,
      gravitySlope: 4,
      onLift: false,
      currentLift: null,
      fallen: false,
      fallTimer: 0,
      lastSafePos: new THREE.Vector3(0, 1.2, 8)
    };

    // Lifts (remontées)
    const lifts = {
      aiguille: {
        chairs: [],
        pathStart: new THREE.Vector3(-30, 0, 10),
        pathEnd:   new THREE.Vector3(-30, 40, -120),
        speed: 5
      },
      chaux: {
        chairs: [],
        pathStart: new THREE.Vector3(30, 0, 10),
        pathEnd:   new THREE.Vector3(30, 45, -160),
        speed: 6
      }
    };

    // Météo
    const weatherState = {
      mode: 'sunny', // 'sunny' | 'snow' | 'foggy'
      snowGroup: null
    };

    // Matériaux du skieur pour le shop
    const skierMaterials = {
      body: null,
      skis: null,
      head: null
    };

    init();
    animate();

    function init() {
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9fd8ff);
      scene.fog = new THREE.Fog(0x9fd8ff, 60, 400);

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
      camera.position.set(0, 10, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Lumières
      hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(-80, 120, 60);
      scene.add(dirLight);

      createWorld();
      createLifts();
      createSkier();
      createBots();

      setupJoystick();
      setupUI();
      setWeather('sunny');

      window.addEventListener('resize', onWindowResize);
    }

    // ==========================
    //         MONDE 3D
    // ==========================
    function createWorld() {
      // Plan de neige
      const geometry = new THREE.PlaneGeometry(400, 600, 40, 60);
      const material = new THREE.MeshStandardMaterial({
        color: 0xf9fcff,
        roughness: 0.8,
        metalness: 0.0
      });
      worldPlane = new THREE.Mesh(geometry, material);
      worldPlane.rotation.x = -Math.PI / 2;
      worldPlane.position.set(0, 0, -200);
      scene.add(worldPlane);

      // Relief
      const posAttr = worldPlane.geometry.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        let height = 0;

        const distFromCenterX = Math.abs(x) / 200;
        height += distFromCenterX * 10;

        const distZ = (-z - 150) / 200;
        if (distZ > 0) {
          height += Math.sin(distZ * Math.PI) * 18;
        }

        posAttr.setY(i, height);
      }
      posAttr.needsUpdate = true;
      worldPlane.geometry.computeVertexNormals();

      // Bas de station
      const baseGeometry = new THREE.PlaneGeometry(120, 80);
      const baseMaterial = new THREE.MeshStandardMaterial({
        color: 0xe2e5f0,
        roughness: 0.7
      });
      const baseStation = new THREE.Mesh(baseGeometry, baseMaterial);
      baseStation.rotation.x = -Math.PI / 2;
      baseStation.position.set(0, 0.05, 10);
      scene.add(baseStation);

      // Files d’attente
      const queueMat = new THREE.MeshStandardMaterial({ color: 0xd1c44a });
      const queueAiguille = new THREE.Mesh(new THREE.PlaneGeometry(10, 20), queueMat);
      queueAiguille.rotation.x = -Math.PI / 2;
      queueAiguille.position.set(-30, 0.06, 18);
      scene.add(queueAiguille);

      const queueChaux = new THREE.Mesh(new THREE.PlaneGeometry(14, 24), queueMat);
      queueChaux.rotation.x = -Math.PI / 2;
      queueChaux.position.set(30, 0.06, 18);
      scene.add(queueChaux);

      // Pistes
      createSlopeLine(new THREE.Color(0x3b82f6), -5, 0);
      createSlopeLine(new THREE.Color(0xef4444), 10, -40);
      createSlopeLine(new THREE.Color(0x111827), -18, -80);

      // Arbres
      createTrees();
    }

    function createSlopeLine(color, offsetX, offsetZ) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
      const geom = new THREE.PlaneGeometry(2, 220);
      const slope = new THREE.Mesh(geom, mat);
      slope.rotation.x = -Math.PI / 2;
      slope.position.set(offsetX, 0.08, -120 + offsetZ);
      scene.add(slope);
    }

    function createTrees() {
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x1f6b3b });

      for (let i = 0; i < 80; i++) {
        const x = (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 120);
        const z = -40 - Math.random() * 450;

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), trunkMat);
        trunk.position.set(x, 1.5, z);

        const leaves = new THREE.Mesh(new THREE.ConeGeometry(3 + Math.random(), 8 + Math.random() * 4, 8), leafMat);
        leaves.position.set(x, 6.5, z);

        scene.add(trunk);
        scene.add(leaves);

        // Ajouter comme obstacle (collision sur le tronc)
        obstacles.push({ mesh: trunk, radius: 1.3 });
      }
    }

    // ==========================
    //          REMONTÉES
    // ==========================
    function createLifts() {
      createLift('aiguille', lifts.aiguille, 6, 3);
      createLift('chaux', lifts.chaux, 8, 6);
    }

    function createLift(name, lift, poleCount, seatsPerChair) {
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x4b5563 });
      const cableMat = new THREE.LineBasicMaterial({ color: 0x374151 });

      const pathVec = new THREE.Vector3().subVectors(lift.pathEnd, lift.pathStart);

      // Pylônes
      for (let i = 0; i <= poleCount; i++) {
        const t = i / poleCount;
        const pos = new THREE.Vector3().copy(lift.pathStart).addScaledVector(pathVec, t);
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 10, 8), poleMat);
        pole.position.set(pos.x, pos.y + 5, pos.z);
        scene.add(pole);

        obstacles.push({ mesh: pole, radius: 1.4 });
      }

      // Câble
      const cablePoints = [
        lift.pathStart.clone().add(new THREE.Vector3(0, 8, 0)),
        lift.pathEnd.clone().add(new THREE.Vector3(0, 8, 0))
      ];
      const cableGeom = new THREE.BufferGeometry().setFromPoints(cablePoints);
      const cable = new THREE.Line(cableGeom, cableMat);
      scene.add(cable);

      // Sièges
      const chairGeom = new THREE.BoxGeometry(3, 0.3, 0.8);
      const chairMat = new THREE.MeshStandardMaterial({ color: name === 'aiguille' ? 0x60a5fa : 0xf97316 });

      const segmentCount = seatsPerChair * 3;
      for (let i = 0; i < segmentCount; i++) {
        const t = i / segmentCount;
        const basePos = new THREE.Vector3().copy(lift.pathStart).addScaledVector(pathVec, t);
        const chairGroup = new THREE.Group();

        const bar = new THREE.Mesh(chairGeom, chairMat);
        bar.position.set(0, 0, 0);

        const barVertical = new THREE.Mesh(
          new THREE.BoxGeometry(0.12, 2.3, 0.12),
          new THREE.MeshStandardMaterial({ color: 0x4b5563 })
        );
        barVertical.position.set(0, 1.3, 0);

        chairGroup.add(barVertical);
        chairGroup.add(bar);

        chairGroup.position.copy(basePos).add(new THREE.Vector3(0, 8, 0));
        scene.add(chairGroup);

        lift.chairs.push({
          mesh: chairGroup,
          t: t,
          length: pathVec.length()
        });
      }
    }

    function updateLifts(delta) {
      Object.keys(lifts).forEach((key) => {
        const lift = lifts[key];
        const dir = new THREE.Vector3().subVectors(lift.pathEnd, lift.pathStart).normalize();

        lift.chairs.forEach((chair) => {
          const travel = (chair.t * chair.length + delta * lift.speed) % chair.length;
          chair.t = travel / chair.length;

          const pos = new THREE.Vector3().copy(lift.pathStart).addScaledVector(dir, travel);
          chair.mesh.position.set(pos.x, pos.y + 8, pos.z);

          // Si joueur sur la remontée -> accroché à un siège
          if (playerState.onLift && playerState.currentLift === key) {
            if (pos.y < 10 && pos.z > -20) {
              skierGroup.position.set(pos.x, pos.y + 1.5, pos.z);
              playerState.velocity.set(0, 0, 0);
            }
          }
        });
      });
    }

    // ==========================
    //          SKIEUR
    // ==========================
    function createSkier() {
      skierGroup = new THREE.Group();

      // Corps
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8 });
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.5, 1.8, 4, 8),
        bodyMat
      );
      body.position.y = 2.2;
      skierGroup.add(body);

      // Tête
      const headMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 16, 16),
        headMat
      );
      head.position.y = 3.4;
      skierGroup.add(head);

      // Skis
      const skiMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.2, roughness: 0.4 });
      const skiGeom = new THREE.BoxGeometry(1.2, 0.08, 3.4);

      const skiLeft = new THREE.Mesh(skiGeom, skiMat);
      skiLeft.position.set(-0.35, 1.05, 0.2);
      skierGroup.add(skiLeft);

      const skiRight = skiLeft.clone();
      skiRight.position.set(0.35, 1.05, -0.2);
      skierGroup.add(skiRight);

      skierGroup.position.set(0, 1.2, 8);
      scene.add(skierGroup);
      skier = skierGroup;

      // Sauver les matériaux pour le shop
      skierMaterials.body = bodyMat;
      skierMaterials.head = headMat;
      skierMaterials.skis = skiMat.clone();
    }

    function updateSkier(delta) {
      // Gestion chute
      if (playerState.fallen) {
        playerState.fallTimer -= delta;
        // animation simple de roulade
        skierGroup.rotation.z += 6 * delta;
        if (playerState.fallTimer <= 0) {
          // respawn
          playerState.fallen = false;
          skierGroup.rotation.set(0, skierGroup.rotation.y, 0);
          skierGroup.position.copy(playerState.lastSafePos);
          fallInfo.style.display = 'none';
        }
        speedInfo.textContent = "0.0";
        return;
      }

      const inputX = joystick.valueX;
      const inputY = -joystick.valueY;

      const inputMagnitude = Math.min(Math.sqrt(inputX * inputX + inputY * inputY), 1);
      let inputDir = new THREE.Vector3(0, 0, 0);

      if (inputMagnitude > 0.05) {
        inputDir.set(inputX, 0, -inputY).normalize();

        const targetAngle = Math.atan2(inputDir.x, inputDir.z);
        const currentAngle = skierGroup.rotation.y;
        const angleDiff = targetAngle - currentAngle;
        skierGroup.rotation.y += angleDiff * 8 * delta;
      }

      if (!playerState.onLift) {
        if (inputMagnitude > 0.05) {
          const accel = inputDir.multiplyScalar(playerState.acceleration * inputMagnitude * delta);
          playerState.velocity.add(accel);
        }

        playerState.velocity.z -= playerState.gravitySlope * delta;

        const horizontalVel = new THREE.Vector3(playerState.velocity.x, 0, playerState.velocity.z);
        const speed = horizontalVel.length();
        if (speed > 0) {
          const frictionForce = Math.min(playerState.friction * delta, speed);
          horizontalVel.addScaledVector(horizontalVel.clone().normalize(), -frictionForce);
          playerState.velocity.x = horizontalVel.x;
          playerState.velocity.z = horizontalVel.z;
        }

        const newSpeed = horizontalVel.length();
        if (newSpeed > playerState.maxSpeed) {
          horizontalVel.setLength(playerState.maxSpeed);
          playerState.velocity.x = horizontalVel.x;
          playerState.velocity.z = horizontalVel.z;
        }

        skierGroup.position.addScaledVector(playerState.velocity, delta);

        const ySnow = getHeightOnWorld(skierGroup.position.x, skierGroup.position.z);
        skierGroup.position.y = ySnow + 1.2;

        // Mémoriser une position safe (pas trop raide)
        if (skierGroup.position.z > -450) {
          playerState.lastSafePos.copy(skierGroup.position);
        }
      }

      if (skierGroup.position.z < -500) {
        skierGroup.position.set(0, 30, -260);
        playerState.velocity.set(0, 0, 5);
      }

      const displayedSpeed = playerState.onLift
        ? 0
        : new THREE.Vector3(playerState.velocity.x, 0, playerState.velocity.z).length();
      speedInfo.textContent = displayedSpeed.toFixed(1);

      if (!playerState.onLift && distance2D(skierGroup.position, new THREE.Vector3(-30, 0, 18)) < 6) {
        queueInfo.textContent = "File Aiguille";
      } else if (!playerState.onLift && distance2D(skierGroup.position, new THREE.Vector3(30, 0, 18)) < 7) {
        queueInfo.textContent = "File Chaux";
      } else {
        queueInfo.textContent = "bas des pistes";
      }

      if (playerState.onLift && skierGroup.position.y > 38) {
        playerState.onLift = false;
        playerState.currentLift = null;
        liftInfo.textContent = "aucune";
        playerState.velocity.set(0, 0, -6);
      }
    }

    function distance2D(a, b) {
      const dx = a.x - b.x;
      const dz = a.z - b.z;
      return Math.sqrt(dx * dx + dz * dz);
    }

    function getHeightOnWorld(x, z) {
      if (!worldPlane) return 0;
      const local = new THREE.Vector3(x, 0, z).sub(worldPlane.position);
      const geom = worldPlane.geometry;
      const pos = geom.attributes.position;

      const widthSegments = 40;
      const heightSegments = 60;
      const width = 400;
      const height = 600;

      const halfW = width / 2;
      const halfH = height / 2;

      const u = (local.x + halfW) / width;
      const v = (local.z + halfH) / height;

      const i = Math.floor(u * widthSegments);
      const j = Math.floor(v * heightSegments);

      const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

      const ii = clamp(i, 0, widthSegments - 1);
      const jj = clamp(j, 0, heightSegments - 1);

      const index = jj * (widthSegments + 1) + ii;

      const y = pos.getY(index);
      return y;
    }

    // ==========================
    //           BOTS
    // ==========================
    function createBots() {
      const colors = [0x10b981, 0xec4899, 0xf97316, 0x6366f1, 0x22c55e, 0x0ea5e9];

      for (let i = 0; i < BOT_COUNT; i++) {
        const group = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.4, 1.4, 4, 8),
          new THREE.MeshStandardMaterial({ color: colors[i % colors.length] })
        );
        body.position.y = 1.9;
        group.add(body);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.35, 14, 14),
          new THREE.MeshStandardMaterial({ color: 0xfff3c4 })
        );
        head.position.y = 2.9;
        group.add(head);

        const skiMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
        const skiGeom = new THREE.BoxGeometry(1, 0.06, 2.8);
        const skiL = new THREE.Mesh(skiGeom, skiMat);
        skiL.position.set(-0.3, 0.9, 0.15);
        group.add(skiL);
        const skiR = skiL.clone();
        skiR.position.set(0.3, 0.9, -0.15);
        group.add(skiR);

        scene.add(group);

        const startX = (Math.random() - 0.5) * 60;
        const startZ = -100 - Math.random() * 280;
        group.position.set(startX, 5, startZ);

        const speed = 8 + Math.random() * 14;
        const drift = (Math.random() - 0.5) * 6;

        bots.push({
          mesh: group,
          speed,
          drift,
          offsetPhase: Math.random() * Math.PI * 2
        });
      }
    }

    function updateBots(delta) {
      const t = clock.getElapsedTime();

      bots.forEach(bot => {
        const pos = bot.mesh.position;
        pos.z -= bot.speed * delta;

        pos.x += Math.sin(t * 0.7 + bot.offsetPhase) * bot.drift * delta;

        // Éviter un peu le joueur
        const d = distance2D(pos, skierGroup.position);
        if (d < 6) {
          const dirAway = new THREE.Vector3(
            pos.x - skierGroup.position.x,
            0,
            pos.z - skierGroup.position.z
          ).normalize();
          pos.x += dirAway.x * 4 * delta;
          pos.z += dirAway.z * 4 * delta;
        }

        const ySnow = getHeightOnWorld(pos.x, pos.z);
        bot.mesh.position.y = ySnow + 1;

        if (pos.z < -520) {
          pos.z = -120 + Math.random() * -240;
          pos.x = (Math.random() - 0.5) * 80;
        }

        bot.mesh.rotation.y = Math.atan2(0, -bot.speed);
      });
    }

    // ==========================
    //          CAMERA
    // ==========================
    function updateCamera(delta) {
      const offsetBehind = 10;
      const offsetUp = 6;

      const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(
        new THREE.Vector3(0,1,0),
        skierGroup.rotation.y
      );

      const targetPos = new THREE.Vector3().copy(skierGroup.position)
        .addScaledVector(dir, -offsetBehind)
        .add(new THREE.Vector3(0, offsetUp, 0));

      camera.position.lerp(targetPos, 4 * delta);
      camera.lookAt(skierGroup.position.x, skierGroup.position.y + 2, skierGroup.position.z);
    }

    // ==========================
    //          JOYSTICK
    // ==========================
    function setupJoystick() {
      function getPoint(e) {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      const baseRect = () => joystickBase.getBoundingClientRect();

      const start = (e) => {
        e.preventDefault();
        joystick.active = true;
        const rect = baseRect();
        joystick.baseX = rect.left + rect.width / 2;
        joystick.baseY = rect.top + rect.height / 2;
        const p = getPoint(e);
        updateStick(p.x, p.y);
      };

      const move = (e) => {
        if (!joystick.active) return;
        e.preventDefault();
        const p = getPoint(e);
        updateStick(p.x, p.y);
      };

      const end = (e) => {
        joystick.active = false;
        joystick.valueX = 0;
        joystick.valueY = 0;
        joystickStick.style.transform = `translate(0px, 0px)`;
      };

      function updateStick(px, py) {
        const dx = px - joystick.baseX;
        const dy = py - joystick.baseY;
        const maxRadius = 60;
        const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
        const angle = Math.atan2(dy, dx);
        const nx = Math.cos(angle) * dist;
        const ny = Math.sin(angle) * dist;

        joystickStick.style.transform = `translate(${nx}px, ${ny}px)`;
        joystick.valueX = nx / maxRadius;
        joystick.valueY = ny / maxRadius;
      }

      joystickBase.addEventListener('touchstart', start, { passive: false });
      joystickBase.addEventListener('touchmove', move, { passive: false });
      joystickBase.addEventListener('touchend', end, { passive: false });
      joystickBase.addEventListener('touchcancel', end, { passive: false });

      joystickBase.addEventListener('mousedown', start);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }

    // ==========================
    //            UI
    // ==========================
    function setupUI() {
      btnAiguille.addEventListener('click', () => {
        takeLift('aiguille');
      });
      btnChaux.addEventListener('click', () => {
        takeLift('chaux');
      });

      // Météo
      btnWeather.addEventListener('click', () => {
        if (weatherState.mode === 'sunny') setWeather('snow');
        else if (weatherState.mode === 'snow') setWeather('foggy');
        else setWeather('sunny');
      });

      // Shop
      btnShop.addEventListener('click', () => {
        shopPanel.style.display = 'flex';
        shopOverlay.style.pointerEvents = 'auto';
      });

      shopClose.addEventListener('click', () => {
        shopPanel.style.display = 'none';
        shopOverlay.style.pointerEvents = 'none';
      });

      shopOverlay.addEventListener('click', (e) => {
        if (e.target === shopOverlay) {
          shopPanel.style.display = 'none';
          shopOverlay.style.pointerEvents = 'none';
        }
      });

      const shopItems = shopPanel.querySelectorAll('.shop-item');
      shopItems.forEach(item => {
        item.addEventListener('click', () => {
          const style = item.getAttribute('data-style');
          applyOutfit(style);
        });
      });
    }

    function takeLift(name) {
      playerState.onLift = true;
      playerState.currentLift = name;
      playerState.velocity.set(0, 0, 0);

      liftInfo.textContent = name === 'aiguille'
        ? 'Aiguille (3 places)'
        : 'Chaux (6 places)';

      btnAiguille.classList.toggle('active', name === 'aiguille');
      btnChaux.classList.toggle('active', name === 'chaux');

      if (name === 'aiguille') {
        skierGroup.position.set(-30, 1.2, 18);
      } else {
        skierGroup.position.set(30, 1.2, 18);
      }
    }

    // ==========================
    //          MÉTÉO
    // ==========================
    function setWeather(mode) {
      weatherState.mode = mode;
      weatherInfo.textContent = mode === 'sunny' ? 'soleil' : mode === 'snow' ? 'neige' : 'brouillard';

      if (weatherState.snowGroup) {
        scene.remove(weatherState.snowGroup);
        weatherState.snowGroup = null;
      }

      if (mode === 'sunny') {
        scene.background = new THREE.Color(0x9fd8ff);
        scene.fog.color.set(0x9fd8ff);
        scene.fog.near = 60;
        scene.fog.far = 400;
        hemiLight.intensity = 1.0;
        dirLight.intensity = 0.9;
      } else if (mode === 'snow') {
        scene.background = new THREE.Color(0xbcd7f5);
        scene.fog.color.set(0xbcd7f5);
        scene.fog.near = 40;
        scene.fog.far = 260;
        hemiLight.intensity = 0.9;
        dirLight.intensity = 0.7;
        createSnowParticles();
      } else if (mode === 'foggy') {
        scene.background = new THREE.Color(0xcbd5f5);
        scene.fog.color.set(0xcbd5f5);
        scene.fog.near = 20;
        scene.fog.far = 140;
        hemiLight.intensity = 0.7;
        dirLight.intensity = 0.5;
      }
    }

    function createSnowParticles() {
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3 + 0] = (Math.random() - 0.5) * 120;
        positions[i * 3 + 1] = 10 + Math.random() * 40;
        positions[i * 3 + 2] = -80 - Math.random() * 260;
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.25,
        color: 0xffffff,
        transparent: true,
        opacity: 0.8
      });
      const points = new THREE.Points(geom, mat);
      weatherState.snowGroup = points;
      scene.add(points);
    }

    function updateSnow(delta) {
      if (!weatherState.snowGroup) return;
      const pos = weatherState.snowGroup.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let y = pos.getY(i);
        let z = pos.getZ(i);
        y -= 5 * delta;
        z += 1.2 * delta;
        if (y < 0) y = 40;
        if (z > -60) z = -260 - Math.random() * 80;
        pos.setY(i, y);
        pos.setZ(i, z);
      }
      pos.needsUpdate = true;
    }

    // ==========================
    //           SHOP
    // ==========================
    function applyOutfit(style) {
      if (!skierMaterials.body || !skierMaterials.head) return;
      if (style === 'blue') {
        skierMaterials.body.color.setHex(0x1d4ed8);
        skierMaterials.head.color.setHex(0xfacc15);
      } else if (style === 'red') {
        skierMaterials.body.color.setHex(0xb91c1c);
        skierMaterials.head.color.setHex(0xfbbf24);
      } else if (style === 'green') {
        skierMaterials.body.color.setHex(0x047857);
        skierMaterials.head.color.setHex(0xfef3c7);
      }
    }

    // ==========================
    //        COLLISIONS
    // ==========================
    function checkCollisions() {
      if (playerState.onLift || playerState.fallen) return;

      const playerPos = skierGroup.position;
      const playerRadius = 0.9;

      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        const pos = o.mesh.position;
        const dx = playerPos.x - pos.x;
        const dz = playerPos.z - pos.z;
        const distSq = dx * dx + dz * dz;
        const r = playerRadius + o.radius;
        if (distSq < r * r) {
          triggerFall();
          break;
        }
      }
    }

    function triggerFall() {
      if (playerState.fallen) return;
      playerState.fallen = true;
      playerState.fallTimer = 2.2;
      playerState.velocity.set(0, 0, 0);
      fallInfo.style.display = 'block';
    }

    // ==========================
    //         MINIMAP
    // ==========================
    function updateMinimap() {
      if (!mmCtx) return;
      const w = minimapCanvas.width;
      const h = minimapCanvas.height;

      mmCtx.clearRect(0, 0, w, h);

      // Fond
      mmCtx.fillStyle = 'rgba(15,23,42,0.9)';
      mmCtx.fillRect(0, 0, w, h);

      // Montagne (zone jouable)
      mmCtx.strokeStyle = 'rgba(148,163,184,0.9)';
      mmCtx.lineWidth = 1;
      mmCtx.strokeRect(8, 8, w - 16, h - 16);

      // Conversion monde -> minimap
      const worldXMin = -120, worldXMax = 120;
      const worldZMin = -520, worldZMax = 40;

      const mapX = (x) => {
        const t = (x - worldXMin) / (worldXMax - worldXMin);
        return 8 + t * (w - 16);
      };
      const mapY = (z) => {
        const t = (z - worldZMin) / (worldZMax - worldZMin);
        return 8 + (1 - t) * (h - 16); // inverser pour que le bas de station soit en haut
      };

      // Pistes principales (juste quelques lignes verticales symboliques)
      mmCtx.strokeStyle = 'rgba(59,130,246,0.6)';
      mmCtx.beginPath();
      mmCtx.moveTo(mapX(-5), mapY(-40));
      mmCtx.lineTo(mapX(-5), mapY(-400));
      mmCtx.stroke();

      mmCtx.strokeStyle = 'rgba(239,68,68,0.6)';
      mmCtx.beginPath();
      mmCtx.moveTo(mapX(10), mapY(-40));
      mmCtx.lineTo(mapX(10), mapY(-420));
      mmCtx.stroke();

      // Joueur
      const px = mapX(skierGroup.position.x);
      const py = mapY(skierGroup.position.z);
      mmCtx.fillStyle = '#facc15';
      mmCtx.beginPath();
      mmCtx.arc(px, py, 4, 0, Math.PI * 2);
      mmCtx.fill();

      // Bots
      mmCtx.fillStyle = '#60a5fa';
      bots.forEach(bot => {
        const bx = mapX(bot.mesh.position.x);
        const by = mapY(bot.mesh.position.z);
        mmCtx.beginPath();
        mmCtx.arc(bx, by, 2, 0, Math.PI * 2);
        mmCtx.fill();
      });
    }

    // ==========================
    //       BOUCLE PRINCIPALE
    // ==========================
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      updateLifts(delta);
      updateSkier(delta);
      updateBots(delta);
      updateCamera(delta);
      checkCollisions();
      updateSnow(delta);
      updateMinimap();

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
